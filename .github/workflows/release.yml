name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux GUI dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libgl1-mesa-dev libxxf86vm-dev xorg-dev

      - uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Build Linux binary
        run: go build -ldflags="-s -w" -o sm-unlocker-linux .

      - uses: actions/upload-artifact@v4
        with:
          name: sm-unlocker-linux
          path: sm-unlocker-linux

  build-windows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install MinGW
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-mingw-w64 g++-mingw-w64

      - uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Build Windows binary
        run: CGO_ENABLED=1 CC=x86_64-w64-mingw32-gcc CXX=x86_64-w64-mingw32-g++ GOOS=windows GOARCH=amd64 go build -ldflags="-s -w -H=windowsgui" -o sm-unlocker-windows.exe .

      - uses: actions/upload-artifact@v4
        with:
          name: sm-unlocker-windows
          path: sm-unlocker-windows.exe

  release:
    needs: [build-linux, build-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Write checksums
        working-directory: dist
        run: sha256sum sm-unlocker-linux sm-unlocker-windows.exe > sha256sums.txt

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/sm-unlocker-linux
            dist/sm-unlocker-windows.exe
            dist/sha256sums.txt
